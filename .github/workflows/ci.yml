# RECONSTRUCTED FILE — see docs/week1/03_environment_setup.md and the note
# below. This file does not exist in the upstream repo (Dcoder21/Amdari-
# Project--02) or in this fork as inherited, even though the README,
# docs/VULN_INDEX.md and docs/ARCHITECTURE_NOTES.md all refer to it as the
# "current (inadequate) CI pipeline" and attribute V-PIP-01 through V-PIP-03
# to it directly. Rather than block Week 3 on sourcing the original, this
# reconstructs the minimal workflow that produces exactly the three defects
# the case study and vulnerability index describe, so there is still a
# genuine "before" to fix against:
#
#   V-PIP-01 (fixed) — build-and-push now signs every pushed image keylessly
#     with cosign, using the OIDC identity token GitHub Actions issues this
#     job. A new verify-signature job (and the deploy job) verify the
#     signature and fail closed via scripts/verify_image_signature.sh
#     before anything downstream trusts the image.
#   V-PIP-02 (fixed) — build-and-push now generates a CycloneDX SBOM per
#     image with Syft, attaches it to the image digest, signs the
#     attachment with cosign, and uploads it as a workflow artifact — not
#     just produced and discarded.
#   V-PIP-03 — the deploy job authenticates with a long-lived AWS access key
#              pair (GitHub secrets, not OIDC) belonging to an IAM user that
#              — per the case study's cloud-layer findings — has
#              AdministratorAccess. That permission lives on the IAM side,
#              not in this file; nothing here can "show" it beyond the fact
#              that a static key pair is used at all instead of a scoped,
#              short-lived federated credential.
#
# docs/ARCHITECTURE_NOTES.md also states plainly: "The CI workflow ...
# doesn't even fail on a failing test." That is reproduced below via
# `continue-on-error: true` on the test step.
#
# V-PIP-04 (no branch protection on main) is a repository setting, not
# something expressible in this file — tracked separately against the
# fork's branch protection configuration.
#
# This reconstruction is itself an assumption, documented per the
# repository's own rule 4 ("document every assumption"). If the programme
# supplies the actual original file, it replaces this one and this note is
# removed.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  AWS_REGION: af-south-1
  ECR_REGISTRY: 123456789012.dkr.ecr.af-south-1.amazonaws.com

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [payments-api, kyc-api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r services/${{ matrix.service }}/requirements.txt

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        # V-PIP context: a failing test does not fail the job or block the
        # build below — the pipeline reports green regardless.
        continue-on-error: true
        run: pytest tests/ -v

  build-and-push:
    name: build-and-push (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Fix for V-PIP-01: id-token:write is what lets this job request the
      # OIDC identity token cosign uses for keyless signing — no signing
      # key to generate, store, or leak.
      id-token: write
      contents: read
    strategy:
      matrix:
        service: [payments-api, kyc-api]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # V-PIP-03: long-lived static keys from an IAM user with
          # AdministratorAccess, not a scoped OIDC-federated role.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        working-directory: services/${{ matrix.service }}
        run: docker build -t ${{ env.ECR_REGISTRY }}/sentinelpay-${{ matrix.service }}:latest .

      - name: Push image
        id: push
        # V-PIP-02: no SBOM (e.g. Syft) is generated or attached anywhere
        # in this job.
        run: |
          docker push ${{ env.ECR_REGISTRY }}/sentinelpay-${{ matrix.service }}:latest
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.ECR_REGISTRY }}/sentinelpay-${{ matrix.service }}:latest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: cosign sign --yes ${{ steps.push.outputs.digest }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (CycloneDX)
        # Fix for V-PIP-02: a CycloneDX SBOM per build, attached to the
        # image digest and signed — not just produced and discarded.
        run: syft ${{ steps.push.outputs.digest }} -o cyclonedx-json=sbom-${{ matrix.service }}.cdx.json

      - name: Attach and sign SBOM
        run: |
          cosign attach sbom --sbom sbom-${{ matrix.service }}.cdx.json --type cyclonedx ${{ steps.push.outputs.digest }}
          cosign sign --yes --attachment sbom ${{ steps.push.outputs.digest }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json

  verify-signature:
    name: verify-signature (${{ matrix.service }})
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [payments-api, kyc-api]
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify image signature (fails closed)
        # scripts/verify_image_signature.sh is the same check the deploy
        # job below runs before it will touch ECS — this job surfaces a
        # failure here too, on every push, not only on main.
        run: |
          chmod +x scripts/verify_image_signature.sh
          scripts/verify_image_signature.sh ${{ env.ECR_REGISTRY }}/sentinelpay-${{ matrix.service }}:latest

  deploy:
    name: deploy (${{ matrix.service }})
    needs: verify-signature
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [payments-api, kyc-api]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify image signature before deploying (fails closed)
        run: |
          chmod +x scripts/verify_image_signature.sh
          scripts/verify_image_signature.sh ${{ env.ECR_REGISTRY }}/sentinelpay-${{ matrix.service }}:latest

      - name: Force new ECS deployment
        run: >
          aws ecs update-service --cluster sentinelpay --force-new-deployment
          --service ${{ matrix.service }}
