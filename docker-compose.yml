version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentinelpay-postgres
    environment:
      POSTGRES_USER: sentinel
      # Fix for V-CLD-04: no hardcoded password. Set POSTGRES_PASSWORD (and
      # the matching DATABASE_URL below) in a git-ignored .env — see
      # .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sentinelpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: sentinelpay-redis
    ports:
      - "6379:6379"

  payments-api:
    build: ./services/payments-api
    container_name: sentinelpay-payments
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinelpay
      REDIS_URL: redis://redis:6379/0
      # V-APP-02 fix: RS256 keypair, not a shared HS256 secret. payments-api
      # gets both halves because it's the only service that issues tokens.
      # Generated locally by scripts/generate_dev_jwt_keys.sh into a
      # git-ignored .env; docker compose substitutes these automatically.
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64}
      # Fix for V-CLD-04: no hardcoded AWS credentials. Set in a git-ignored
      # .env — see .env.example. (moto mocks S3 in tests, so these are
      # never used for a real AWS call in this environment.)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: af-south-1
      KYC_BUCKET: sentinelpay-kyc-documents
      WEBHOOK_TIMEOUT: "10"
      ENVIRONMENT: development
    depends_on:
      - postgres
      - redis

  kyc-api:
    build: ./services/kyc-api
    container_name: sentinelpay-kyc
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinelpay
      REDIS_URL: redis://redis:6379/1
      # V-APP-02 fix: kyc-api gets only the public key — it verifies tokens
      # payments-api issued, but holds nothing capable of signing one.
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: af-south-1
      KYC_BUCKET: sentinelpay-kyc-documents
      BVN_LOOKUP_URL: https://api.mock-cbn.local/bvn
      ENVIRONMENT: development
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
